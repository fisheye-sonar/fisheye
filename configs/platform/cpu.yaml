dataset:
  batch_size: 1
  workers: 0
  use_blur: true
  use_multithreading: false
  max_workers: 2  # For multithreading

model:
  type: yolov5
  weights: weights/cfc_detect_yolov5s_v1.pt
  device: cpu

inference:
  use_multithreading: false
  max_workers: 2  # For multithreading
  apply_nms_batchwise: true
  apply_length_estimates_batchwise: false
  length_config:
    type: unet
    weights: null
