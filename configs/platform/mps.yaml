dataset:
  batch_size: 16
  workers: 0  # For dataloader
  use_blur: true
  use_multithreading: true
  max_workers: 2  # For multithreading

model:
  type: yolov5
  weights: weights/cfc_detect_yolov5s_v1.pt
  device: mps

inference:
  use_multithreading: true
  max_workers: 2  # For multithreading
  apply_nms_batchwise: true
  apply_length_estimates_batchwise: false
  length_config:
    type: unet
    weights: null
