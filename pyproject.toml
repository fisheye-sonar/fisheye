[tool.poetry]
name = "fisheye"
version = "v1.0.0-dev.1"
description = "Performing inference on sonar data."
authors = ["Madison Van Horn"]
readme = "README.md"
packages = [{include = "fisheye"}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.2.3"
pillow = "^11.1.0"
matplotlib = "^3.10.0"
tqdm = "^4.67.1"
torch = "^2.6.0"
opencv-python = "^4.11.0.86"
lightning = "^2.5.0.post0"
yolov5 = "^7.0.14"
filterpy = "^1.4.5"
structlog = "^25.3.0"


[tool.poetry.group.test.dependencies]
pytest = "^8.3.4"


[tool.poetry.group.dev.dependencies]
jupyterlab = "^4.3.5"
ipykernel = "^6.29.5"
wandb = "^0.19.5"
pre-commit = "^4.1.0"
black = "^25.1.0"
memory-profiler = "^0.61.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry-dynamic-versioning]
enable = true