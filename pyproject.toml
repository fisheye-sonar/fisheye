[tool.poetry]
name = "fisheye"
version = "v1.0.0-beta.3"
description = "Performing inference on sonar data."
authors = ["Madison Van Horn"]
readme = "README.md"
packages = [{include = "fisheye"}]

[tool.poetry.dependencies]
python = ">=3.8,<=3.11"
pandas = [
    { version = "<1.5.0", python = "~3.8" },
    { version = "^2.2.3", python = ">=3.9" }
]
pillow = [
    { version = "<10.0.0", python = "~3.8" },
    { version =  "^11.1.0", python = ">=3.9" }
]
matplotlib = [
    { version = "<3.7.0", python = "~3.8" },
    { version = "^3.10.0", python = ">=3.10" }
]
tqdm = "^4.67.1"
opencv-python = [
    { version = "<4.7.0", python = "~3.8" },
    { version = "^4.11.0.86", python = ">=3.9" }
]
lightning = [
    { version = "<2.1.0", python = "~3.8" },
    { version = "=2.5.0.post0", python = ">=3.9" }
]
yolov5 = "^7.0.14"
filterpy = "^1.4.5"
structlog = [
    { version = "<23.0.0", python = "~3.8" },
    { version = "^25.3.0", python = ">=3.9" }
]
tomli = "^2.2.1"
hydra-core = "^1.3.2"


[tool.poetry.group.test.dependencies]
pytest = "^8.3.4"


[tool.poetry.group.dev.dependencies]
jupyterlab = "^4.3.5"
ipykernel = "^6.29.5"
wandb = "^0.19.5"
pre-commit = [
    { version = "<3.0.0", python = "~3.8" },
    { version = "^4.1.0", python = ">=3.9" }
]
black = [{ version = "<23.0", python = "~3.8" },
    { version = "^25.1.0", python = ">=3.9" }
]
memory-profiler = "^0.61.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
