repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language: system
        entry: poetry run black
        files: \.py$

  - repo: local
    hooks:
      - id: pytest
        name: Run Pytest
        entry: pytest
        language: system
        pass_filenames: false
        args: [--rootdir=tests]
