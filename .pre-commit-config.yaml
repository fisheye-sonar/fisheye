repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language: system
        entry: poetry run black
        files: \.py$

  - repo: local
    hooks:
      - id: check-version-sync
        name: Check _APP_VERSION matches pyproject.toml
        entry: poetry run python scripts/check_version_sync.py
        language: system
        pass_filenames: false
        files: ^(fisheye/version\.py|pyproject\.toml)$

      - id: pytest
        name: Run Pytest
        entry: pytest
        language: system
        pass_filenames: false
        args: [--rootdir=tests]
